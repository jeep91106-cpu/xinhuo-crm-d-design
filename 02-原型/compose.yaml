name: xinhuo-crm-prototype

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: xinhuo-crm-prototype:v0.3-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
